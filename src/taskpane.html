<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Delay Send Settings</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <style>
    body {
      font-family: "Segoe UI", sans-serif;
      font-size: 14px;
      margin: 0;
      padding: 20px;
      background: #fff;
      color: #201f1e;
    }
    h2 {
      font-size: 16px;
      font-weight: 600;
      margin: 0 0 20px;
    }
    section {
      margin-bottom: 24px;
      padding-bottom: 24px;
      border-bottom: 1px solid #edebe9;
    }
    section:last-of-type { border-bottom: none; }
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 500;
    }
    .hint {
      font-size: 12px;
      color: #605e5c;
      margin-bottom: 10px;
    }
    input[type="number"] {
      width: 100%;
      box-sizing: border-box;
      padding: 6px 8px;
      font-size: 14px;
      border: 1px solid #8a8886;
      border-radius: 2px;
      margin-bottom: 14px;
    }
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .toggle-label { font-weight: 500; }
    .toggle {
      position: relative;
      width: 44px;
      height: 24px;
      flex-shrink: 0;
    }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .toggle-slider {
      position: absolute;
      inset: 0;
      background: #c8c6c4;
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .toggle-slider:before {
      content: "";
      position: absolute;
      width: 18px;
      height: 18px;
      left: 3px;
      top: 3px;
      background: white;
      border-radius: 50%;
      transition: transform 0.2s;
    }
    .toggle input:checked + .toggle-slider { background: #0078d4; }
    .toggle input:checked + .toggle-slider:before { transform: translateX(20px); }
    button {
      background: #0078d4;
      color: #fff;
      border: none;
      padding: 8px 16px;
      font-size: 14px;
      border-radius: 2px;
      cursor: pointer;
    }
    button:hover { background: #106ebe; }
    .status {
      margin-top: 10px;
      font-size: 13px;
      min-height: 18px;
    }
  </style>
</head>
<body>
  <h2>Delay Send</h2>

  <section>
    <div class="toggle-row">
      <span class="toggle-label">Send Next Email Immediately</span>
      <label class="toggle">
        <input type="checkbox" id="send-now-toggle" />
        <span class="toggle-slider"></span>
      </label>
    </div>
    <div class="hint">When on, the next email you send will bypass the delay. Resets automatically after sending.</div>
    <div class="status" id="toggle-status"></div>
  </section>

  <section>
    <label for="delay-seconds">Delay duration (seconds)</label>
    <div class="hint">Default is 120 seconds (2 minutes). Minimum is 1 second.</div>
    <input type="number" id="delay-seconds" min="1" step="1" />
    <button id="save-btn">Save</button>
    <div class="status" id="save-status"></div>
  </section>

  <script src="taskpane.js"></script>
</body>
</html>
